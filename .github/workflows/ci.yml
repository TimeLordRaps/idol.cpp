# Continuous integration for idol.cpp.
#
name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP for Clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          git clone https://github.com/speridlabs/idol-sdk.git "$RUNNER_TEMP/idol-sdk"
          git -C "$RUNNER_TEMP/idol-sdk" checkout 4702a7f00850e34b6e83a2170cc123c3e9570744
          python -m pip install "$RUNNER_TEMP/idol-sdk" gguf==0.19.0 transformers==4.57.6 diffusers==0.36.0 huggingface_hub==0.36.2 safetensors==0.8.0 tensordict==0.8.3 numpy==2.3.5 pillow==11.3.0 plyfile==1.1.5 scipy trimesh rtree==1.4.1
          echo "IDOL_SDK=$RUNNER_TEMP/idol-sdk" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Test local server
        env:
          IDOL_MESH_EXE: ${{ github.workspace }}/build/idol_mesh
        run: |
          python -m pip install -r requirements-server.txt
          python -m unittest discover -s tests/python -p test_idol_server.py -v
          python -m unittest discover -s tests/python -p test_setup_iris.py -v
          python tests/python/test_verify_server_reconstruction.py

      - name: Test benchmark tooling
        if: matrix.compiler == 'gcc'
        run: |
          python -m pip install -r requirements-benchmark.txt
          python -m unittest discover -s tests/python -p test_benchmark_analysis.py -v
          python tests/python/test_benchmark_guard.py
          python tests/python/test_benchmark_render.py
          python tests/python/test_benchmark_mesh_render.py
          python tests/python/test_workload_memory.py

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image, which also runs the tests
        run: docker build -t idol-cpp .
      - name: Check the exported image's installed files and imports
        run: python tools/verify_docker_image.py idol-cpp

  # GitHub's macOS runners are Apple Silicon, and the kernels need AVX2, which arm64 does not have. This job builds an
  # x86-64 binary and runs it under Rosetta 2, which supports AVX2 from macOS 15. Apple's clang has no OpenMP, so the
  # job builds single-threaded. Treat it as experimental until it has run: a failure here says "no AVX2 under
  # Rosetta", not necessarily "the code is broken". A native arm64 (NEON) path does not exist yet.
  macos:
    name: macos (x86-64 under Rosetta)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DIDOL_USE_OPENMP=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
